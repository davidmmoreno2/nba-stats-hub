name: "[Prueba] Conectividad nba_api desde Actions"

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar nba_api
        run: pip install nba_api

      - name: Probar llamada real a stats.nba.com
        run: python .github/scripts/test_nba_api_probe.py
